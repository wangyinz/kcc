name: build preserve EPUB TOC fork

on:
  push:
    branches:
      - feature/preserve-epub-toc
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run TOC tests and syntax checks
        run: |
          python -m unittest discover -s tests -v
          python -m py_compile kindlecomicconverter/epubtoc.py kindlecomicconverter/comic2ebook.py kindlecomicconverter/KCC_gui.py kindlecomicconverter/KCC_ui.py

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: 1
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install certifi pyinstaller --no-binary pyinstaller
      - name: Build GUI executable
        run: python setup.py build_binary
      - uses: actions/upload-artifact@v7
        with:
          name: KCC-preserve-epub-toc-windows
          path: dist/*.exe

  macos:
    needs: test
    strategy:
      matrix:
        os: [macos-15-intel, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pyinstaller certifi
          pip install -r requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 16
      - run: npm install -g appdmg
      - name: Build GUI DMG
        run: python setup.py build_binary
      - uses: actions/upload-artifact@v7
        with:
          name: KCC-preserve-epub-toc-macos-${{ runner.arch }}
          path: dist/*.dmg
